<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mom's Tailoring Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card p-4 shadow-sm" style="max-width: 380px; width: 100%;">
    <h3 class="text-center mb-3">🧵 షాప్ లాగిన్ (Shop Login)</h3>
    
    {% if error %}
        <div class="alert alert-danger text-center p-2">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="mb-3">
            <label for="pin" class="form-label fw-bold">PIN నమోదు చేయండి (Enter PIN)</label>
            <input type="password" id="pin" name="pin" class="form-control form-control-lg text-center" maxlength="4" placeholder="****" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">లాగిన్ (Login)</button>
    </form>
</div>

</body>
</html>
